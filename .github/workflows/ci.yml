name: CI - Finanzas Global ERP

# Se ejecuta en cada Pull Request hacia main y en cada integración a main
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

# Cancela ejecuciones antiguas de la misma rama cuando llega un nuevo push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Compilar, probar y medir cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: operaciones-cambio-service

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (con caché de Maven)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven - descargar dependencias y compilar
        run: mvn -B -ntp compile

      - name: Maven - pruebas (JUnit 5 + Spring Boot Test) y cobertura (JaCoCo)
        # 'verify' ejecuta: test -> jacoco:report -> jacoco:check (falla si la cobertura de líneas < 70%)
        run: mvn -B -ntp verify

      - name: Resumen de resultados en la ejecución
        if: always()
        run: |
          echo "### Resultado de pruebas" >> "$GITHUB_STEP_SUMMARY"
          grep -h -E "Tests run:.*Fail" target/surefire-reports/*.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publicar informes (pruebas y JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-calidad
          path: |
            operaciones-cambio-service/target/surefire-reports/
            operaciones-cambio-service/target/site/jacoco/
          if-no-files-found: warn

  docker-build:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: build-test          # solo si compilación + pruebas + cobertura fueron satisfactorias
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t finanzas-global/operaciones-cambio-service:${{ github.sha }} operaciones-cambio-service

  # --- Etapa futura (Entrega Continua), se activa cuando exista registry y entorno de pruebas ---
